<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    body {
      align-items: center;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    main {
      max-width: 34rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      margin: 0 0 1rem;
    }

    .secondary {
      color: #94a3b8;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Access Denied</h1>
    <p class="secondary">{error}</p>
  </main>
</body>
</html>
